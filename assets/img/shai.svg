<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="-3.0 -3.0 134.0 134.0"><style>.mark{fill:none;stroke:#FF3D71;stroke-width:4.2;paint-order:stroke;filter:drop-shadow(0 0 1.5px #fff);transform-box:fill-box;transform-origin:center;animation:mark 1.6s ease-in-out infinite}@keyframes mark{0%,100%{opacity:.45;transform:scale(.9)}50%{opacity:1;transform:scale(1.08)}}.hand{animation:tap 1.6s ease-in-out infinite}@keyframes tap{0%,100%{transform:translate(0,0)}50%{transform:translate(-2.5px,0)}}.spoon,.sip,.palm{transform-box:view-box}.spoon{animation:feed 1.6s ease-in-out infinite}@keyframes feed{0%,100%{transform:translate(5px,7px)}50%{transform:translate(0,0)}}.sip{animation:sip 2s ease-in-out infinite}@keyframes sip{0%,100%{transform:rotate(10deg)}50%{transform:rotate(-6deg)}}.palm{animation:twist .9s ease-in-out infinite alternate}@keyframes twist{from{transform:rotate(-14deg)}to{transform:rotate(14deg)}}.wave,.wag,.nod,.shake,.bow{transform-box:view-box}.wave{animation:wave 1s ease-in-out infinite alternate}@keyframes wave{from{transform:rotate(-16deg)}to{transform:rotate(14deg)}}.wag{animation:wag .5s ease-in-out infinite alternate}@keyframes wag{from{transform:rotate(-16deg)}to{transform:rotate(16deg)}}.nod{animation:nod 1s ease-in-out infinite}@keyframes nod{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(5px) rotate(0) scaleY(.97)}}.shake{animation:shake 1s ease-in-out infinite}@keyframes shake{0%,100%{transform:rotate(0)}25%{transform:rotate(-7deg)}75%{transform:rotate(7deg)}}.bow{animation:bow 2.2s ease-in-out infinite}@keyframes bow{0%,60%,100%{transform:rotate(0) translateY(0)}30%{transform:translateY(5px) rotate(0)}}.bubble{transform-box:fill-box;transform-origin:center;animation:bubble 2.4s ease-in infinite;opacity:0}@keyframes bubble{0%{opacity:0;transform:translate(0,0) scale(.6)}15%{opacity:1}100%{opacity:0;transform:translate(4px,-46px) scale(1.2)}}.squeeze,.beat{transform-box:view-box}.squeeze{animation:squeeze 1.8s ease-in-out infinite}@keyframes squeeze{0%,100%{transform:translate(0,0) rotate(0)}50%{transform:translate(-4px,1px) rotate(-3deg)}}.beat{animation:beat 1.8s ease-in-out infinite}@keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.25)}30%{transform:scale(1)}45%{transform:scale(1.18)}}@media (prefers-reduced-motion:reduce){.mark,.hand,.spoon,.sip,.palm,.wave,.wag,.nod,.shake,.bow,.bubble,.squeeze,.beat{animation:none}}</style><g>
